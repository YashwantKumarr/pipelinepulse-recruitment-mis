[project]
name = "talentflow-ai"
version = "0.1.0"
description = "Recruitment workflow MVP: deterministic fitment, pipeline audit, interviews, reports, optional AI."
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B008"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py"]

[tool.coverage.report]
show_missing = true
